# Case 1 benchmark: benchmarks/run-case.sh sql/scenarios/case-01-filtering-lookup
#
# A typical customer (customer 150000 at seed 42, scale 20: 8 orders in total,
# 4 of them in 2025) and the 2025 calendar year.
param Email casey.stonebridge.150000@example.com
param FromDate 2025-01-01
param ToDate 2026-01-01

# variant NAME SETUP_SQL QUERY_SQL
